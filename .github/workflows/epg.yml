name: EPG

# Regenerates epg.xml daily and commits it, so the raw URL always carries the current week.
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python telefriuli_epg.py -o epg.xml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update epg.xml"
          git push
